[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "c3-harness"
version = "0.1.0"
description = "Configurable planning/execute/reflection harness for agent turns"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "c3-harness contributors" }]

[tool.hatch.build.targets.wheel]
packages = ["c3_harness"]
